# Metadane domów REFIT przepisane z data/raw/REFIT_Readme.txt.
# Plik opisuje tylko fakty z README; decyzje (co wykluczyć, czego używać) podejmuje pipeline.
#
# Każdy kanał (Appliance1..9):
#   label     - oryginalna nazwa z README
#   appliance - typ kanoniczny NA POCZĄTKU nagrań (lista w metadata.py); null = nieużywany / nieznany
#   mixed     - kanał mierzy kilka urządzeń naraz (np. "Television Site", dwa urządzenia na jednym IAM)
#   note      - dodatkowa informacja z README
#   events    - zmiany w czasie:
#       appliance_changed - na kanale jest od tej daty inny typ urządzenia (pole appliance = nowy typ)
#       device_replaced   - wymiana na inny egzemplarz tego samego typu
#       device_added      - od tej daty na kanale jest dodatkowe urządzenie
#       signature_change  - zmiana charakterystyki poboru bez podanej przyczyny
#     date: null = data nieznana; approx: true = data przybliżona
#
# Daty w README są w formacie DD/MM/YYYY, tutaj YYYY-MM-DD.

